[package]
name = "mdport"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "Compact mdport.v1 transfer records for Markdown documents and corpus slices."
license = "MIT"
repository = "https://github.com/giodl73-repo/MDPORT"
homepage = "https://github.com/giodl73-repo/MDPORT"
documentation = "https://docs.rs/mdport"
readme = "README.md"
keywords = ["markdown", "context", "provenance", "serialization", "documents"]
categories = ["data-structures", "encoding", "text-processing"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
